name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android (première fois seulement)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Autoriser le GPS et la caméra
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q ACCESS_FINE_LOCATION $M; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />' $M
          fi

      - name: Générer les icônes Android depuis le logo Balagh
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#F6F0E6' --iconBackgroundColorDark '#13251C' --splashBackgroundColor '#F6F0E6' --splashBackgroundColorDark '#13251C'

      - name: Synchroniser l'application web
        run: npx cap sync android

      - name: Compiler l'APK de test
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: balagh-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
